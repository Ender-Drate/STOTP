# auth-center nginx 反向代理示例
# 放到 /etc/nginx/sites-available/auth-center 并软链到 sites-enabled
# 证书路径按实际修改

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name auth.yxzhou.com;

    ssl_certificate     /etc/letsencrypt/live/auth.yxzhou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.yxzhou.com/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 单层 nginx：覆盖客户端伪造的 XFF。若前面还有可信代理，再改成 $proxy_add_x_forwarded_for
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.yxzhou.com;
    return 301 https://$host$request_uri;
}
