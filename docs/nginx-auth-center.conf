# auth-center nginx 反向代理示例
# 放到 /etc/nginx/sites-available/auth-center 并软链到 sites-enabled
# 证书路径按实际修改

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name auth.yxzhou.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/auth.yxzhou.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.yxzhou.com/privkey.pem;

    client_max_body_size 2m;

    # 安全响应头（Next 也会设置；nginx 这里兜底，防止代理错误页缺头）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        # 关键：应用只信任 nginx 覆盖后的 X-Real-IP。
        # 其余客户端可伪造的头一律覆盖或丢弃，绝不能透传。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header CF-Connecting-IP  $remote_addr;
        proxy_set_header Forwarded         "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_hide_header X-Powered-By;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.yxzhou.com;
    return 301 https://$host$request_uri;
}
